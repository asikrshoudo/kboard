name: Release

# Runs when version.txt changes on main. Runs tests and lint, builds a signed
# APK and AAB, and publishes them as GitHub Release "v<version>". The release
# creates its own tag, so no manual git tag is needed. Versions containing "-"
# (for example 0.0.1-test) are published as pre-releases.
on:
  push:
    branches: [main]
    paths:
      - version.txt

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        run: echo "VERSION=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_ENV"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.KBOARD_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kboard.p12"
          echo "KBOARD_KEYSTORE_PATH=$RUNNER_TEMP/kboard.p12" >> "$GITHUB_ENV"
      - name: Test, lint and build signed APK and AAB
        env:
          KBOARD_KEYSTORE_PASSWORD: ${{ secrets.KBOARD_KEYSTORE_PASSWORD }}
          KBOARD_KEY_ALIAS: ${{ secrets.KBOARD_KEY_ALIAS }}
        run: >
          ./gradlew check assembleRelease bundleRelease
          -Pkboard.versionName="$VERSION"
          -Pkboard.versionCode="$GITHUB_RUN_NUMBER"
      - name: Verify APK signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          if [[ "$VERSION" == *-* ]]; then FLAGS="--prerelease"; fi
          gh release create "v$VERSION" $FLAGS --target "$GITHUB_SHA" --generate-notes \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab
