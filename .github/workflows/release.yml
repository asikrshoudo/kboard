name: Release

# Runs when a version tag is pushed, e.g. v0.1.0. Builds a signed APK and
# AAB and attaches them to a GitHub Release. Tags containing "-" (such as
# v0.0.1-test) are published as pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.KBOARD_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kboard.p12"
          echo "KBOARD_KEYSTORE_PATH=$RUNNER_TEMP/kboard.p12" >> "$GITHUB_ENV"
      - name: Build signed APK and AAB
        env:
          KBOARD_KEYSTORE_PASSWORD: ${{ secrets.KBOARD_KEYSTORE_PASSWORD }}
          KBOARD_KEY_ALIAS: ${{ secrets.KBOARD_KEY_ALIAS }}
        run: >
          ./gradlew assembleRelease bundleRelease
          -Pkboard.versionName="${GITHUB_REF_NAME#v}"
          -Pkboard.versionCode="${GITHUB_RUN_NUMBER}"
      - name: Verify APK signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then FLAGS="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" $FLAGS --generate-notes \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab
