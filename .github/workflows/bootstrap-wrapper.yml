name: Bootstrap Gradle wrapper

# Manual only. Generates the Gradle wrapper in CI (no local Gradle exists)
# and commits it to the branch it was run on.
on:
  workflow_dispatch:
    inputs:
      gradle_version:
        description: Gradle version to pin
        required: true
        default: "9.9.1"

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.gradle_version }}
      - name: Generate wrapper
        run: gradle wrapper --gradle-version "${{ inputs.gradle_version }}" --distribution-type bin
      - name: Commit wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          git commit -m "build: add Gradle wrapper ${{ inputs.gradle_version }}"
          git push
