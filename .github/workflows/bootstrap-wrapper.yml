name: Bootstrap Gradle wrapper

# Generates the Gradle wrapper in CI (no local Gradle exists) and commits it.
# Runs when gradle/wrapper-version.txt changes. The commit is made with
# GITHUB_TOKEN, which does not trigger further workflows, so no loop.
on:
  push:
    paths:
      - gradle/wrapper-version.txt
      - .github/workflows/bootstrap-wrapper.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Gradle version
        id: version
        run: echo "value=$(tr -d '[:space:]' < gradle/wrapper-version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.version.outputs.value }}
      - name: Generate wrapper
        run: gradle wrapper --gradle-version "${{ steps.version.outputs.value }}" --distribution-type bin
      - name: Commit wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          git diff --cached --quiet || git commit -m "build: pin Gradle wrapper ${{ steps.version.outputs.value }}"
          git push
